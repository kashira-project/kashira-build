#
# kashira /etc/makepkg.conf — clang-first, x86-64-v3
#

CARCH="x86_64"
CHOST="x86_64-kashira-linux-gnu"

# toolchain: LLVM by default, GCC only where a package demands it
export CC=clang
export CPP=clang-cpp  # xorg RAWCPP macro needs a stdin-capable preprocessor; no gcc cpp without gcc
export CXX=clang++
export LD=ld.lld
export AR=llvm-ar
export NM=llvm-nm
export RANLIB=llvm-ranlib
export OBJCOPY=llvm-objcopy
export OBJDUMP=llvm-objdump
export STRIP=llvm-strip

CPPFLAGS=""
# Flag profile rev 4 (2026-10-22): Arch's hardening plus AerynOS boulder defaults (github.com/aerynOS/os-tools,
# boulder/data/macros/arch/base.yaml): ThinLTO, RELR, safe ICF, TLS descriptors; no frame pointers (owner decision).
# The -Wno-error list covers clang-only noise only; implicit-function-declaration, int-conversion and
# incompatible-pointer-types stay errors (they catch real miscompiles). kbuild-inside.sh adjusts per tier/knob.
CFLAGS="-march=x86-64-v3 -O2 -pipe -fno-plt -fexceptions \
        -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security \
        -fstack-clash-protection -fcf-protection -mtls-dialect=gnu2 \
        -Wno-error=unknown-warning-option -Wno-error=unused-command-line-argument \
        -Wno-error=unused-but-set-variable -Wno-error=unused-but-set-global \
        -Wno-error=deprecated-declarations -Wno-error=c2y-extensions \
        -Wno-error=incompatible-pointer-types-discards-qualifiers"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
LDFLAGS="-Wl,-O1 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now \
         -Wl,-z,pack-relative-relocs -Wl,--icf=safe -Wl,--build-id=sha1 \
         -Wl,--undefined-version -Wl,--hash-style=gnu -Wl,--compress-debug-sections=zstd"
LTOFLAGS="-flto=thin"
RUSTFLAGS="-C target-cpu=x86-64-v3"
DEBUG_CFLAGS="-g"
DEBUG_CXXFLAGS="$DEBUG_CFLAGS"
DEBUG_RUSTFLAGS="-C debuginfo=2"
export GOAMD64=v3
BUILDENV=(!distcc color ccache !check !sign)
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge debug lto autodeps)
# every autotools package generates it; the install-info hook regenerates
PURGE_TARGETS=(usr/{,share}/info/dir .packlist *.pod)  # Arch parity: perl module pods/packlists conflict otherwise
#-- Prefix and directories for library autodeps
LIB_DIRS=('lib:usr/lib' 'lib32:usr/lib32')

INTEGRITY_CHECK=(sha256)
STRIP_BINARIES="--strip-all"
STRIP_SHARED="--strip-unneeded"
STRIP_STATIC="--strip-debug"

DLAGENTS=('file::/usr/bin/curl -qgC - -o %o %u'
          'ftp::/usr/bin/curl -qgfC - --ftp-pasv --retry 3 --retry-delay 3 -o %o %u'
          'http::/usr/bin/curl -qgb "" -fLC - --retry 3 --retry-delay 3 -o %o %u'
          'https::/usr/bin/curl -qgb "" -fLC - --retry 3 --retry-delay 3 -o %o %u'
          'rsync::/usr/bin/rsync --no-motd -z %u %o'
          'scp::/usr/bin/scp -C %u %o')

VCSAGENTS=('git::/usr/bin/git'
           'bzr::/usr/bin/bzr'
           'fossil::/usr/bin/fossil'
           'hg::/usr/bin/hg'
           'svn::/usr/bin/svn')

MAKEFLAGS="-j$(nproc)"
PACKAGER="kashira build system <root@kashira>"

COMPRESSGZ=(gzip -c -f -n)
COMPRESSBZ2=(bzip2 -c -f)
COMPRESSXZ=(xz -c -z -T0 -)
COMPRESSZST=(zstd -c -19 -T0 -)
COMPRESSLRZ=(lrzip -q)
COMPRESSLZO=(lzop -q)
COMPRESSZ=(compress -c -f)
COMPRESSLZ4=(lz4 -q)
COMPRESSLZ=(lzip -c -f)

PKGEXT='.pkg.tar.zst'
SRCEXT='.src.tar.gz'
