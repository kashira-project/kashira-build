#
# kashira /etc/makepkg.conf — clang-first, x86-64-v3
#

CARCH="x86_64"
CHOST="x86_64-kashira-linux-gnu"

# toolchain: LLVM by default, GCC only where a package demands it
export CC=clang
export CPP=clang-cpp  # xorg RAWCPP macro needs a stdin-capable preprocessor; no gcc cpp without gcc
export CXX=clang++
export LD=ld.lld
export AR=llvm-ar
export NM=llvm-nm
export RANLIB=llvm-ranlib
export OBJCOPY=llvm-objcopy
export OBJDUMP=llvm-objdump
export STRIP=llvm-strip

CPPFLAGS=""
CFLAGS="-march=x86-64-v3 -O2 -pipe -fno-plt -fexceptions \
        -Wp,-D_FORTIFY_SOURCE=3 -fstack-clash-protection -fcf-protection"
CXXFLAGS="$CFLAGS"
LDFLAGS="-Wl,-O1 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now -Wl,--undefined-version -Wl,--hash-style=gnu -Wl,--compress-debug-sections=zstd"
LTOFLAGS=""
RUSTFLAGS="-C target-cpu=x86-64-v3"

# pacman 7: no fakeroot (ownership handled internally); check is a BUILDENV knob
BUILDENV=(!distcc color !ccache !check !sign)
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug !lto autodeps)
# every autotools package generates it; the install-info hook regenerates
PURGE_TARGETS=(usr/{,share}/info/dir .packlist *.pod)  # Arch parity: perl module pods/packlists conflict otherwise
#-- Prefix and directories for library autodeps
LIB_DIRS=('lib:usr/lib' 'lib32:usr/lib32')

INTEGRITY_CHECK=(sha256)
STRIP_BINARIES="--strip-all"
STRIP_SHARED="--strip-unneeded"
STRIP_STATIC="--strip-debug"

DLAGENTS=('file::/usr/bin/curl -qgC - -o %o %u'
          'ftp::/usr/bin/curl -qgfC - --ftp-pasv --retry 3 --retry-delay 3 -o %o %u'
          'http::/usr/bin/curl -qgb "" -fLC - --retry 3 --retry-delay 3 -o %o %u'
          'https::/usr/bin/curl -qgb "" -fLC - --retry 3 --retry-delay 3 -o %o %u'
          'rsync::/usr/bin/rsync --no-motd -z %u %o'
          'scp::/usr/bin/scp -C %u %o')

VCSAGENTS=('git::/usr/bin/git'
           'bzr::/usr/bin/bzr'
           'fossil::/usr/bin/fossil'
           'hg::/usr/bin/hg'
           'svn::/usr/bin/svn')

MAKEFLAGS="-j$(nproc)"
PACKAGER="kashira build system <root@kashira>"

COMPRESSGZ=(gzip -c -f -n)
COMPRESSBZ2=(bzip2 -c -f)
COMPRESSXZ=(xz -c -z -T0 -)
COMPRESSZST=(zstd -c -19 -T0 -)
COMPRESSLRZ=(lrzip -q)
COMPRESSLZO=(lzop -q)
COMPRESSZ=(compress -c -f)
COMPRESSLZ4=(lz4 -q)
COMPRESSLZ=(lzip -c -f)

PKGEXT='.pkg.tar.zst'
SRCEXT='.src.tar.gz'
