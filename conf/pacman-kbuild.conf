# kbuild container pacman config: our local build repo ONLY.
# A dep that is not in here fails loudly -> import it into kashira-arch
# (tools/sync.py import <pkg>) or add it to kashira-pkgs. Never hand-install.
[options]
Architecture = x86_64
SigLevel = Never
ParallelDownloads = 8

[kashira]
Server = file:///repo
