# Kashira live-ISO build configuration. Points at the native v3 build repo;
# never at the canonical cache or a remote. Local candidate archives are unsigned.
[options]
HoldPkg     = pacman glibc
Architecture = x86_64
ParallelDownloads = 5
SigLevel    = Never
LocalFileSigLevel = Never

[kashira]
Server = file:///mnt/kashira/repos/v3
