# kashira headless base image.
# Builds entirely from the local kashira repo (see mkosi.sandbox/etc/pacman.conf).

[Distribution]
Distribution=arch
# The kashira repo is unsigned.
RepositoryKeyCheck=no

[Output]
Format=disk
Output=kashira-headless

[Content]
Bootable=yes
Bootloader=systemd-boot
Packages=
        base
        systemd
        systemd-sysvcompat
        linux
        pacman
        sudo-rs
        vim

# Serial-first console: this is the headless profile.
KernelCommandLine=
        console=tty0
        console=ttyS0,115200

Hostname=kashira

[Validation]
SecureBoot=yes
SecureBootKey=/mnt/lfs/src/kashira/keys/secureboot/db.key
SecureBootCertificate=/mnt/lfs/src/kashira/keys/secureboot/db.crt
SecureBootSignTool=sbsign

[Build]
# The sandbox mkosi runs pacman in only exposes /usr, /etc, /home, ... so
# bind the local repo in to make file:///mnt/lfs/... resolvable.
ExtraSearchPaths=
        /mnt/lfs/var/cache/pacman/kashira
        /mnt/lfs/src/kashira-build/image/headless/stubrepo
