# kashira headless base image.
# The build cache is bootstrap-only; the installed pacman.conf stays package-owned.

[Distribution]
Distribution=arch
# The local build cache is unsigned. Runtime repository policy is shipped by pacman.
RepositoryKeyCheck=no

[Output]
Format=disk
Output=kashira-headless

[Content]
Bootable=yes
Bootloader=systemd-boot
# Keep root locked and make the default image non-interactive.
Autologin=no
Packages=
        base
        systemd
        systemd-sysvcompat
        linux
        pacman
        sudo-rs
        vim

# Serial-first console: this is the headless profile.
KernelCommandLine=
        console=tty0
        console=ttyS0,115200

Hostname=kashira

[Validation]
# Sign UKIs, but never enroll keys automatically. Firmware setup/enrollment is manual.
SecureBoot=yes
SecureBootAutoEnroll=no
SecureBootKey=/mnt/lfs/src/kashira/keys/secureboot/db.key
SecureBootCertificate=/mnt/lfs/src/kashira/keys/secureboot/db.crt
SecureBootSignTool=sbsign

[Build]
PackageCacheDirectory=/mnt/lfs/tmp/khi-pkg-cache
# The sandbox mkosi otherwise cannot resolve the local bootstrap cache.
ExtraSearchPaths=
        /mnt/lfs/var/cache/pacman/kashira
