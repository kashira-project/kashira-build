# pacman configuration used by mkosi when installing into the image.
# mkosi leaves a pre-existing sandbox pacman.conf untouched, so this is the
# single source of truth: the local unsigned kashira repo only.
[options]
Architecture = x86_64
SigLevel = Never
ParallelDownloads = 5

[kashira]
Server = file:///mnt/lfs/var/cache/pacman/kashira

# Empty stand-ins for packages mkosi-initrd's Arch profile asks for but the
# kashira repo doesn't carry (btrfs-progs, xfsprogs, dosfstools, libfido2).
# Keep this repo LAST so real packages always win if they appear in kashira.
[kashira-mkosi-stubs]
Server = file:///mnt/lfs/src/kashira-build/image/headless/stubrepo
SigLevel = Never
