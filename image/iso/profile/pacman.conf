# Kashira live-ISO build configuration (mkarchiso pacstraps the airootfs with it).
# Every package comes from the public R2 repo and must carry a valid kashira signature.
[options]
HoldPkg     = pacman glibc
Architecture = x86_64
ParallelDownloads = 5
SigLevel    = Required DatabaseRequired
LocalFileSigLevel = Never

[kashira-v3]
Server = https://repo.kashiraproject.org/x86_64-v3
